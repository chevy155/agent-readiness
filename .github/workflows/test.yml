name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable)
        run: pip install -e .

      - name: Run tests
        run: python -m pytest -q

      - name: Scan this repo (terminal output)
        run: agent-scan . --output terminal

      - name: Scan this repo (JSON output)
        run: agent-scan . --output json

      - name: Scan this repo (Markdown report)
        run: agent-scan . --output markdown

      - name: Upload AGENT_READINESS.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-readiness-report-py${{ matrix.python-version }}
          path: AGENT_READINESS.md
          if-no-files-found: warn
