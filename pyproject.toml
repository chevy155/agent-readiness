[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-readiness"
version = "0.1.0"
description = "Deterministic CLI that scans a repository for AI coding agent readiness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["ai-agents", "github", "cursor", "copilot", "claude", "devtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
# Zero runtime dependencies — stdlib only
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
agent-scan = "agent_readiness.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/agent-readiness"
Issues = "https://github.com/yourusername/agent-readiness/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_readiness*"]

[tool.setuptools.package-data]
"*" = ["templates/*.template"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"
